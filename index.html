<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>SolveX — Умный математический помощник</title>
<style>
:root{
  --bg:#0f1115; --card:#1a1d23; --card2:#23272f;
  --text:#ffffff; --text2:#8a92a6;
  --accent:#00d9a3; --accent2:#00a87e;
  --danger:#ff5566; --border:#2a2f3a;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 50% 0%,#1a1d23 0%,#0f1115 70%);
  padding:16px;
}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
header{text-align:center;padding:6px 0 2px;}
header h1{margin:0;font-size:34px;font-weight:900;color:var(--accent);letter-spacing:3px;}
header p{margin:4px 0 0;font-size:11px;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:var(--radius);padding:4px;overflow-x:auto;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:70px;padding:10px 6px;border:none;background:transparent;color:var(--text2);
  font-size:12px;font-weight:700;cursor:pointer;border-radius:10px;transition:.2s;font-family:inherit;white-space:nowrap;}
.tab.active{background:var(--accent);color:#0f1115;}
.tab:hover:not(.active){background:var(--card2);color:var(--text);}
#input{width:100%;min-height:90px;padding:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);font-size:17px;
  font-family:"SF Mono",Menlo,Consolas,monospace;resize:vertical;outline:none;transition:border-color .2s;}
#input:focus{border-color:var(--accent);}
#input::placeholder{color:var(--text2);}
.actions{display:flex;gap:8px;}
.btn{flex:1;padding:14px;border:none;border-radius:var(--radius);font-size:14px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:.5px;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--accent);color:#0f1115;}
.btn.primary:hover{background:var(--accent2);}
.btn.secondary{background:var(--card2);color:var(--text);}
.btn.secondary:hover{background:#2b303a;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.danger:hover{background:var(--danger);color:#fff;}
#keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);
  padding:10px;border-radius:var(--radius);}
#keypad.hidden{display:none;}
.k{padding:16px 0;background:var(--card2);border:none;border-radius:10px;color:var(--text);
  font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;transition:.1s;}
.k:hover{background:#2b303a;}
.k:active{transform:scale(.95);}
.k.op{color:var(--accent);}
.k.fn{color:var(--text2);font-size:16px;}
.k.eq{background:var(--accent);color:#0f1115;}
.k.eq:hover{background:var(--accent2);}
.k.danger{color:var(--danger);}
#result{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--border);}
.card .label{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:2px;margin-bottom:10px;}
.card .answer{font-size:28px;font-weight:900;font-family:"SF Mono",Menlo,Consolas,monospace;
  color:var(--text);word-break:break-word;line-height:1.3;}
.card .steps{display:flex;flex-direction:column;gap:10px;}
.step{padding:10px 12px;background:var(--card2);border-radius:10px;
  font-family:"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;}
.step .stitle{font-size:11px;color:var(--text2);font-family:inherit;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:4px;font-weight:700;}
.card.error{border-color:var(--danger);}
.card.error .label{color:var(--danger);}
.hidden{display:none !important;}
#history{display:flex;flex-direction:column;gap:10px;}
.hitem{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--border);
  cursor:pointer;transition:.2s;}
.hitem:hover{border-color:var(--accent);}
.hitem .hexpr{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:var(--text2);
  margin-bottom:6px;word-break:break-word;}
.hitem .hans{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:18px;font-weight:700;
  color:var(--accent);word-break:break-word;}
.hitem .hmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
  font-size:11px;color:var(--text2);}
.hitem .del{color:var(--danger);padding:4px 10px;cursor:pointer;border-radius:6px;font-weight:700;}
.hitem .del:hover{background:rgba(255,85,102,.15);}
.empty{text-align:center;color:var(--text2);padding:40px 20px;font-size:14px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--accent);color:#0f1115;padding:12px 22px;border-radius:30px;
  font-weight:800;font-size:13px;opacity:0;transition:.3s;z-index:100;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,217,163,.35);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (max-width:400px){
  header h1{font-size:28px;}
  #input{font-size:15px;min-height:80px;}
  .k{padding:14px 0;font-size:16px;}
}

<body>
<div class="app">
  <header>
    <h1>SolveX</h1>
    <p>Умный математический помощник</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-mode="calc">Калькулятор</button>
    <button class="tab" data-mode="equation">Уравнения</button>
    <button class="tab" data-mode="problem">Задачи</button>
    <button class="tab" data-mode="history">История</button>
  </nav>

  <div id="inputArea">
    <textarea id="input" rows="3" placeholder="Введите выражение, например: 2+2 или sqrt(144)"></textarea>
    <div class="actions" style="margin-top:8px;">
      <button class="btn primary" id="btnSolve">Решить</button>
      <button class="btn secondary" id="btnClear">Очистить</button>
    </div>
  </div>

  <div id="keypad"></div>
  <div id="result"></div>
  <div id="history" class="hidden"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   FRACTION
   ========================================================= */
class Fraction{
  constructor(n,d=1){
    if(d===0) throw new Error('Деление на ноль');
    if(d<0){n=-n;d=-d;}
    const g=Fraction.gcd(Math.abs(n),Math.abs(d))||1;
    this.n=n/g; this.d=d/g;
  }
  static gcd(a,b){return b===0?a:Fraction.gcd(b,a%b);}
  add(o){return new Fraction(this.n*o.d+o.n*this.d,this.d*o.d);}
  sub(o){return new Fraction(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){return new Fraction(this.n*o.n,this.d*o.d);}
  div(o){if(o.n===0)throw new Error('Деление на ноль');return new Fraction(this.n*o.d,this.d*o.n);}
  value(){return this.n/this.d;}
  toString(){return this.d===1?String(this.n):this.n+'/'+this.d;}
}

/* =========================================================
   UTILS
   ========================================================= */
function fmt(v){
  if(!isFinite(v))return String(v);
  if(Math.abs(v-Math.round(v))<1e-10)return String(Math.round(v));
  let s=v.toFixed(10);
  s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   EXPRESSION TOKENIZER + SHUNTING-YARD
   ========================================================= */
const PREC={'+':1,'-':1,'*':2,'/':2,'^':3,'u-':4,'u+':4};
const RIGHT_ASSOC={'^':true,'u-':true,'u+':true};
const FUNCS=['sqrt','cbrt'];

function tokenize(str){
  str=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.');
  str=str.replace(/²/g,'^2').replace(/³/g,'^3');
  str=str.replace(/π/g,'pi').replace(/√/g,'sqrt');
  str=str.replace(/\s+/g,'');

  const tokens=[];
  let i=0, prevType='start';

  while(i<str.length){
    const c=str[i];
    if(/[0-9.]/.test(c)){
      let n='';
      while(i<str.length && /[0-9.]/.test(str[i])){n+=str[i];i++;}
      if((n.match(/\./g)||[]).length>1) throw new Error('Некорректное число: '+n);
      tokens.push({type:'num',value:parseFloat(n)});
      prevType='num';
      continue;
    }
    if(/[a-zA-Z]/.test(c)){
      let w='';
      while(i<str.length && /[a-zA-Z]/.test(str[i])){w+=str[i];i++;}
      const wl=w.toLowerCase();
      if(wl==='pi'){tokens.push({type:'num',value:Math.PI});prevType='num';}
      else if(wl==='e'){tokens.push({type:'num',value:Math.E});prevType='num';}
      else if(FUNCS.includes(wl)){tokens.push({type:'func',value:wl});prevType='op';}
      else throw new Error('Неизвестная функция: '+w);
      continue;
    }
    if(c==='('){tokens.push({type:'op',value:'('});prevType='lparen';i++;continue;}
    if(c===')'){tokens.push({type:'op',value:')'});prevType='rparen';i++;continue;}
    if('+-*/^'.includes(c)){
      const isUnary=(c==='-'||c==='+') && (prevType==='start'||prevType==='op'||prevType==='lparen');
      tokens.push({type:'op',value:isUnary?('u'+c):c});
      prevType='op';
      i++;
      continue;
    }
    throw new Error('Недопустимый символ: '+c);
  }
  return tokens;
}

function toRPN(tokens){
  const out=[],stack=[];
  for(const t of tokens){
    if(t.type==='num'){out.push(t);}
    else if(t.type==='func'){stack.push(t);}
    else if(t.value==='('){stack.push(t);}
    else if(t.value===')'){
      while(stack.length && stack[stack.length-1].value!=='(') out.push(stack.pop());
      if(!stack.length) throw new Error('Несогласованные скобки');
      stack.pop();
      if(stack.length && stack[stack.length-1].type==='func') out.push(stack.pop());
    } else {
      while(stack.length){
        const top=stack[stack.length-1];
        if(top.value==='('||top.type==='func') break;
        const tp=PREC[top.value]||0;
        const cp=PREC[t.value]||0;
        if(tp>cp || (tp===cp && !RIGHT_ASSOC[t.value])) out.push(stack.pop());
        else break;
      }
      stack.push(t);
    }
  }
  while(stack.length){
    const top=stack.pop();
    if(top.value==='(') throw new Error('Несогласованные скобки');
    out.push(top);
  }
  return out;
}

function evalRPN(rpn){
  const st=[];
  for(const t of rpn){
    if(t.type==='num'){st.push(t.value);}
    else if(t.type==='func'){
      if(!st.length) throw new Error('Недостаточно аргументов');
      const a=st.pop();
      if(t.value==='sqrt'){
        if(a<0) throw new Error('Корень из отрицательного числа');
        st.push(Math.sqrt(a));
      } else if(t.value==='cbrt'){
        st.push(Math.cbrt(a));
      }
    } else {
      const v=t.value;
      if(v==='u-'){if(!st.length)throw new Error('Недостаточно аргументов');const a=st.pop();st.push(-a);continue;}
      if(v==='u+'){continue;}
      if(st.length<2) throw new Error('Недостаточно операндов');
      const b=st.pop(),a=st.pop();
      switch(v){
        case '+': st.push(a+b); break;
        case '-': st.push(a-b); break;
        case '*': st.push(a*b); break;
        case '/': if(Math.abs(b)<1e-15) throw new Error('Деление на ноль'); st.push(a/b); break;
        case '^': st.push(Math.pow(a,b)); break;
        default: throw new Error('Неизвестная операция');
      }
    }
  }
  if(st.length!==1) throw new Error('Ошибка в выражении');
  return st[0];
}

/* =========================================================
   SOLVERS
   ========================================================= */
function solveExpression(s){
  const tokens=tokenize(s);
  const rpn=toRPN(tokens);
  const value=evalRPN(rpn);
  if(!isFinite(value)) throw new Error('Результат не является числом');
  const answer=fmt(value);

  const steps=[];
  steps.push({title:'Выражение',content:s});
  steps.push({title:'Постфиксная форма (RPN)',content:rpn.map(t=>t.type==='num'?fmt(t.value):t.value).join(' ')});
  steps.push({title:'Результат',content:answer});

  return {ok:true,answer,type:'calc',steps};
}

function parseLinearSide(str){
  str=str.replace(/\s+/g,'').replace(/−/g,'-').replace(/[хХ]/g,'x').replace(/X/g,'x');
  let a=0,b=0,i=0,sign=1;
  while(i<str.length){
    const c=str[i];
    if(c==='+'){sign=1;i++;continue;}
    if(c==='-'){sign=-1;i++;continue;}
    let term='';
    while(i<str.length && str[i]!=='+' && str[i]!=='-'){term+=str[i];i++;}
    if(!term) continue;
    if(term.includes('x')){
      const coefStr=term.replace(/x/g,'').replace(/\*/g,'');
      let coef=1;
      if(coefStr!=='' && coefStr!=='.') coef=parseFloat(coefStr);
      a+=sign*coef;
    } else {
      if(term!=='' && term!=='.') b+=sign*parseFloat(term);
    }
  }
  return {a,b};
}

function solveLinear(s){
  s=s.replace(/\s+/g,'').replace(/−/g,'-').replace(/[хХ]/g,'x').replace(/X/g,'x');
  const parts=s.split('=');
  if(parts.length!==2) throw new Error('Уравнение должно содержать один знак =');

  const L=parseLinearSide(parts[0]);
  const R=parseLinearSide(parts[1]);
  const a=L.a-R.a;
  const b=L.b-R.b;

  const steps=[];
  steps.push({title:'Условие',content:s});
  steps.push({title:'Приводим к виду ax + b = 0',content:`${fmt(a)}x + (${fmt(b)}) = 0`});

  if(Math.abs(a)<1e-12){
    if(Math.abs(b)<1e-12){
      return {ok:true,answer:'x — любое число',type:'linear',
        steps:[...steps,{title:'Вывод',content:'0 = 0 — тождество'}]};
    }
    throw new Error('Уравнение не имеет решений');
  }

  steps.push({title:'Переносим свободный член',content:`${fmt(a)}x = ${fmt(-b)}`});
  steps.push({title:'Делим на коэффициент при x',content:`x = ${fmt(-b)} / ${fmt(a)}`});
  const x=-b/a;
  steps.push({title:'Ответ',content:'x = '+fmt(x)});
  return {ok:true,answer:'x = '+fmt(x),type:'linear',steps};
}

function parseQuadraticSide(str){
  str=str.replace(/\s+/g,'').replace(/−/g,'-').replace(/[хХ]/g,'x').replace(/X/g,'x');
  str=str.replace(/x²/g,'x^2').replace(/x\*\*2/g,'x^2').replace(/x\*x/g,'x^2');
  let a=0,b=0,c=0,i=0,sign=1;
  while(i<str.length){
    const ch=str[i];
    if(ch==='+'){sign=1;i++;continue;}
    if(ch==='-'){sign=-1;i++;continue;}
    let term='';
    while(i<str.length && str[i]!=='+' && str[i]!=='-'){term+=str[i];i++;}
    if(!term) continue;
    if(term.includes('x^2')){
      const coefStr=term.replace(/x\^2/g,'').replace(/\*/g,'');
      let coef=1;
      if(coefStr!=='' && coefStr!=='.') coef=parseFloat(coefStr);
      a+=sign*coef;
    } else if(term.includes('x')){
      const coefStr=term.replace(/x/g,'').replace(/\*/g,'');
      let coef=1;
      if(coefStr!=='' && coefStr!=='.') coef=parseFloat(coefStr);
      b+=sign*coef;
    } else {
      if(term!=='' && term!=='.') c+=sign*parseFloat(term);
    }
  }
  return {a,b,c};
}

function solveQuadratic(s){
  s=s.replace(/\s+/g,'').replace(/−/g,'-').replace(/[хХ]/g,'x').replace(/X/g,'x');
  s=s.replace(/x²/g,'x^2');

  const parts=s.split('=');
  if(parts.length!==2) throw new Error('Должен быть один знак =');

  const L=parseQuadraticSide(parts[0]);
  const R=parseQuadraticSide(parts[1]);
  const a=L.a-R.a, b=L.b-R.b, c=L.c-R.c;

  const steps=[];
  steps.push({title:'Условие',content:s});
  steps.push({title:'Коэффициенты',content:`a = ${fmt(a)}\nb = ${fmt(b)}\nc = ${fmt(c)}`});

  if(Math.abs(a)<1e-12) throw new Error('Это не квадратное уравнение (a = 0)');

  const D=b*b-4*a*c;
  steps.push({title:'Дискриминант',content:`D = b² − 4ac = (${fmt(b)})² − 4·(${fmt(a)})·(${fmt(c)})\nD = ${fmt(b*b)} − ${fmt(4*a*c)} = ${fmt(D)}`});

  if(D<-1e-12){
    steps.push({title:'Вывод',content:'D < 0 — действительных корней нет'});
    return {ok:true,answer:'Нет действительных корней',type:'quadratic',steps};
  }

  if(Math.abs(D)<1e-12){
    const x=-b/(2*a);
    steps.push({title:'Формула',content:`D = 0 — один корень\nx = −b / (2a) = ${fmt(-b)} / ${fmt(2*a)} = ${fmt(x)}`});
    return {ok:true,answer:'x = '+fmt(x),type:'quadratic',steps};
  }

  const sq=Math.sqrt(D);
  const x1=(-b-sq)/(2*a);
  const x2=(-b+sq)/(2*a);
  steps.push({title:'√D',content:'√D = '+fmt(sq)});
  steps.push({title:'x₁',content:`x₁ = (−b − √D) / (2a)\nx₁ = (${fmt(-b)} − ${fmt(sq)}) / ${fmt(2*a)} = ${fmt(x1)}`});
  steps.push({title:'x₂',content:`x₂ = (−b + √D) / (2a)\nx₂ = (${fmt(-b)} + ${fmt(sq)}) / ${fmt(2*a)} = ${fmt(x2)}`});
  return {ok:true,answer:`x₁ = ${fmt(x1)},   x₂ = ${fmt(x2)}`,type:'quadratic',steps};
}

function solveFraction(s){
  const clean=s.replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  const tokens=[];
  let i=0;
  while(i<clean.length){
    const c=clean[i];
    if(/[0-9]/.test(c)){
      let num='';
      while(i<clean.length && /[0-9]/.test(clean[i])){num+=clean[i];i++;}
      let n=parseInt(num,10);
      if(i<clean.length && clean[i]==='/'){
        i++;
        let den='';
        while(i<clean.length && /[0-9]/.test(clean[i])){den+=clean[i];i++;}
        if(den==='') throw new Error('Ожидалось число после /');
        tokens.push({type:'frac',value:new Fraction(n,parseInt(den,10))});
      } else {
        tokens.push({type:'frac',value:new Fraction(n,1)});
      }
    } else if('+-*/'.includes(c)){
      tokens.push({type:'op',value:c});
      i++;
    } else {
      throw new Error('Недопустимый символ: '+c);
    }
  }

  const steps=[{title:'Условие',content:s}];

  for(let k=1;k<tokens.length-1;){
    const op=tokens[k].value;
    if(op==='*'||op==='/'){
      const a=tokens[k-1].value, b=tokens[k+1].value;
      const res=op==='*'?a.mul(b):a.div(b);
      steps.push({title:null,content:`${a} ${op==='*'?'×':'÷'} ${b} = ${res}`});
      tokens.splice(k-1,3,{type:'frac',value:res});
    } else k++;
  }
  for(let k=1;k<tokens.length-1;){
    const op=tokens[k].value;
    if(op==='+'||op==='-'){
      const a=tokens[k-1].value, b=tokens[k+1].value;
      const res=op==='+'?a.add(b):a.sub(b);
      steps.push({title:null,content:`${a} ${op} ${b} = ${res}`});
      tokens.splice(k-1,3,{type:'frac',value:res});
    } else k++;
  }
  if(tokens.length!==1) throw new Error('Ошибка в выражении с дробями');

  const result=tokens[0].value;
  steps.push({title:'Итог',content:result.toString()});
  if(result.d!==1){
    steps.push({title:'Десятичное представление',content:'≈ '+result.value().toFixed(6)});
  }
  return {ok:true,answer:result.toString(),type:'fraction',steps};
}

function solvePercent(s){
  const low=s.toLowerCase().replace(/\s+/g,'').replace(/,/g,'.');
  const steps=[{title:'Условие',content:s}];

  // X% от Y
  let m=low.match(/(-?\d+\.?\d*)%от(-?\d+\.?\d*)/);
  if(m){
    const p=parseFloat(m[1]), y=parseFloat(m[2]);
    steps.push({title:'Формула',content:`${p}% от ${y} = ${y} × ${p} / 100`});
    const res=y*p/100;
    steps.push({title:'Решение',content:`${y} × ${p} / 100 = ${fmt(res)}`});
    return {ok:true,answer:fmt(res),type:'percent',steps};
  }

  // Y ± X%
  m=low.match(/(-?\d+\.?\d*)([+\-])(\d+\.?\d*)%/);
  if(m){
    const base=parseFloat(m[1]);
    const op=m[2];
    const p=parseFloat(m[3]);
    const delta=base*p/100;
    steps.push({title:'Процент от числа',content:`${p}% от ${base} = ${base} × ${p} / 100 = ${fmt(delta)}`});
    const res=op==='+'?base+delta:base-delta;
    steps.push({title:'Результат',content:`${fmt(base)} ${op} ${fmt(delta)} = ${fmt(res)}`});
    return {ok:true,answer:fmt(res),type:'percent',steps};
  }

  // процентное изменение
  if(/процент/.test(low) && /(было|стало|измен|рост|пад)/.test(low)){
    const nums=(low.match(/-?\d+\.?\d*/g)||[]).map(Number);
    if(nums.length>=2){
      const oldV=nums[0], newV=nums[1];
      if(Math.abs(oldV)<1e-12) throw new Error('Деление на ноль');
      const diff=newV-oldV;
      const pct=diff/Math.abs(oldV)*100;
      steps.push({title:'Формула',content:'(новое − старое) / |старое| × 100%'});
      steps.push({title:'Решение',content:`(${fmt(newV)} − ${fmt(oldV)}) / ${fmt(Math.abs(oldV))} × 100% = ${fmt(pct)}%`});
      return {ok:true,answer:fmt(pct)+'%',type:'percent',steps};
    }
  }
  throw new Error('Не удалось распознать процентную задачу');
}

function solveProblem(s){
  const low=s.toLowerCase();
  const nums=(low.match(/-?\d+([.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
  if(nums.length<2) throw new Error('Не удалось распознать задачу — нужно минимум два числа');

  const steps=[{title:'Условие',content:s}];

  // Было ... отдал/потратил ...
  if(/(было|имел|имелось|взял)/.test(low) && /(отдал|потрат|съел|потеря|продал|подарил|убрал|израсход|убрала|съела)/.test(low)){
    const a=nums[0], b=nums[1];
    steps.push({title:'Дано',content:`Было: ${fmt(a)}\nОтдал/потратил: ${fmt(b)}`});
    steps.push({title:'Действие',content:'вычитание'});
    steps.push({title:'Решение',content:`${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}`});
    return {ok:true,answer:fmt(a-b),type:'problem',steps};
  }

  // Было ... купил/добавил ...
  if(/(было|имел|имелось)/.test(low) && /(купил|добав|нашёл|нашел|получ|прибав|собрал|принес)/.test(low)){
    const a=nums[0], b=nums[1];
    steps.push({title:'Дано',content:`Было: ${fmt(a)}\nДобавил: ${fmt(b)}`});
    steps.push({title:'Действие',content:'сложение'});
    steps.push({title:'Решение',content:`${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}`});
    return {ok:true,answer:fmt(a+b),type:'problem',steps};
  }

  // в N раз больше/меньше
  if(/в\s*\d+/.test(low) && /раз/.test(low)){
    const a=nums[0], b=nums[1];
    if(/больше|увелич|умнож/.test(low)){
      steps.push({title:'Действие',content:'умножение'});
      steps.push({title:'Решение',content:`${fmt(a)} × ${fmt(b)} = ${fmt(a*b)}`});
      return {ok:true,answer:fmt(a*b),type:'problem',steps};
    }
    if(/меньше|уменьш|подели|раздели/.test(low)){
      if(Math.abs(b)<1e-12) throw new Error('Деление на ноль');
      steps.push({title:'Действие',content:'деление'});
      steps.push({title:'Решение',content:`${fmt(a)} ÷ ${fmt(b)} = ${fmt(a/b)}`});
      return {ok:true,answer:fmt(a/b),type:'problem',steps};
    }
  }

  if(/сумм|сложи|всего|вместе/.test(low)){
    const a=nums[0], b=nums[1];
    steps.push({title:'Решение',content:`${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}`});
    return {ok:true,answer:fmt(a+b),type:'problem',steps};
  }
  if(/разност|разниц|минус|вычти/.test(low)){
    const a=nums[0], b=nums[1];
    steps.push({title:'Решение',content:`${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}`});
    return {ok:true,answer:fmt(a-b),type:'problem',steps};
  }
  if(/произвед|умнож|перемнож/.test(low)){
    const a=nums[0], b=nums[1];
    steps.push({title:'Решение',content:`${fmt(a)} × ${fmt(b)} = ${fmt(a*b)}`});
    return {ok:true,answer:fmt(a*b),type:'problem',steps};
  }
  if(/частн|раздели|подели/.test(low)){
    const a=nums[0], b=nums[1];
    if(Math.abs(b)<1e-12) throw new Error('Деление на ноль');
    steps.push({title:'Решение',content:`${fmt(a)} ÷ ${fmt(b)} = ${fmt(a/b)}`});
    return {ok:true,answer:fmt(a/b),type:'problem',steps};
  }

  throw new Error('Не удалось автоматически распознать задачу. Попробуйте переформулировать.');
}

/* =========================================================
   MASTER DISPATCHER
   ========================================================= */
function solve(input){
  const s=input.trim();
  if(!s) throw new Error('Введите выражение');

  // Percent: "500 + 20%"
  if(/^-?\d+\.?\d*\s*[+\-]\s*\d+\.?\d*\s*%$/.test(s)) return solvePercent(s);
  // "20% от 500"
  if(/%\s*от/i.test(s) || /процент/i.test(s)) return solvePercent(s);

  // Equation with x
  if(s.includes('=') && /[xхX]/i.test(s)){
    if(/x\s*\^\s*2|x²|x\s*\*\s*x/i.test(s)) return solveQuadratic(s);
    return solveLinear(s);
  }

  // Fractions: "1/2 + 1/3"
  if(/\d+\s*\/\s*\d+/.test(s) && /[+\-*×]/.test(s.replace(/\d+\s*\/\s*\d+/g,''))){
    try{ return solveFraction(s); }catch(e){ /* fallthrough */ }
  }

  // Text problem
  const stripped=s.replace(/\b(pi|e|sqrt|cbrt)\b/gi,'').replace(/[0-9+\-*/^().\s,]/g,'');
  if(stripped.length>2 && /[а-яёa-z]/i.test(stripped)){
    return solveProblem(s);
  }

  // Regular expression
  return solveExpression(s);
}

/* =========================================================
   HISTORY
   ========================================================= */
const History={
  KEY:'solvex_history_v1',
  all(){
    try{
      const raw=localStorage.getItem(this.KEY);
      return raw?JSON.parse(raw):[];
    }catch(e){return [];}
  },
  add(entry){
    const list=this.all();
    list.unshift(entry);
    if(list.length>100) list.length=100;
    localStorage.setItem(this.KEY,JSON.stringify(list));
  },
  remove(idx){
    const list=this.all();
    list.splice(idx,1);
    localStorage.setItem(this.KEY,JSON.stringify(list));
  },
  clear(){
    localStorage.removeItem(this.KEY);
  }
};

/* =========================================================
   UI
   ========================================================= */
let mode='calc';
let lastResult=null;
let lastInput='';

const $=id=>document.getElementById(id);
const input=$('input');
const keypad=$('keypad');
const resultEl=$('result');
const historyEl=$('history');
const inputArea=$('inputArea');

function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2000);
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));

  if(m==='history'){
    inputArea.classList.add('hidden');
    keypad.classList.add('hidden');
    resultEl.innerHTML='';
    historyEl.classList.remove('hidden');
    renderHistory();
  } else {
    inputArea.classList.remove('hidden');
    historyEl.classList.add('hidden');
    keypad.classList.toggle('hidden',m!=='calc');

    if(m==='calc') input.placeholder='Введите выражение, например: 2+2, (15+5)*2, sqrt(144), 2^10';
    else if(m==='equation') input.placeholder='Введите уравнение, например: 2x + 5 = 17 или x² - 5x + 6 = 0';
    else if(m==='problem') input.placeholder='Опишите задачу, например: У Маши было 20 яблок, она отдала 7. Сколько осталось?';

    input.value='';
    resultEl.innerHTML='';
    input.focus();
  }
}

function insertText(text){
  const start=input.selectionStart ?? input.value.length;
  const end=input.selectionEnd ?? input.value.length;
  const before=input.value.slice(0,start);
  const after=input.value.slice(end);
  input.value=before+text+after;
  const pos=start+text.length;
  input.setSelectionRange(pos,pos);
  input.focus();
}

function backspace(){
  const start=input.selectionStart ?? input.value.length;
  const end=input.selectionEnd ?? input.value.length;
  if(start===end && start>0){
    input.value=input.value.slice(0,start-1)+input.value.slice(start);
    input.setSelectionRange(start-1,start-1);
  } else {
    input.value=input.value.slice(0,start)+input.value.slice(end);
    input.setSelectionRange(start,start);
  }
  input.focus();
}

function renderResult(r,inputVal){
  if(!r.ok){
    resultEl.innerHTML=`
      <div class="card error">
        <div class="label">ОШИБКА</div>
        <div class="answer" style="font-size:16px;font-weight:600;">${escapeHtml(r.error||'Не удалось решить выражение. Проверьте ввод.')}</div>
      </div>`;
    return;
  }

  let stepsHtml='';
  for(const s of r.steps){
    stepsHtml+=`<div class="step">${s.title?`<div class="stitle">${escapeHtml(s.title)}</div>`:''}${escapeHtml(s.content)}</div>`;
  }

  resultEl.innerHTML=`
    <div class="card">
      <div class="label">ОТВЕТ</div>
      <div class="answer">${escapeHtml(r.answer)}</div>
    </div>
    <div class="card">
      <div class="label">ПОШАГОВОЕ РЕШЕНИЕ</div>
      <div class="steps">${stepsHtml}</div>
    </div>
    <div class="actions">
      <button class="btn secondary" id="btnCopyAns">Скопировать ответ</button>
      <button class="btn secondary" id="btnCopySol">Скопировать решение</button>
    </div>`;

  $('btnCopyAns').onclick=()=>{
    copy(r.answer);
  };
  $('btnCopySol').onclick=()=>{
    let txt='Задача: '+inputVal+'\n\nОтвет: '+r.answer+'\n\nРешение:\n';
    for(const s of r.steps){
      if(s.title) txt+=s.title+'\n';
      txt+=s.content+'\n\n';
    }
    copy(txt.trim());
  };
}

function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=>showToast('✓ Скопировано'),
      ()=>fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');showToast('✓ Скопировано');}catch(e){showToast('Не удалось скопировать');}
  document.body.removeChild(ta);
}

function doSolve(){
  const val=input.value.trim();
  if(!val){showToast('Введите выражение');return;}

  let r;
  try{
    if(mode==='equation'){
      // Force equation solver
      if(val.includes('=')){
        r=/x\s*\^\s*2|x²|x\s*\*\s*x/i.test(val)?solveQuadratic(val):solveLinear(val);
      } else {
        throw new Error('Уравнение должно содержать знак =');
      }
    } else if(mode==='problem'){
      r=solveProblem(val);
    } else {
      r=solve(val);
    }
  }catch(e){
    r={ok:false,error:e.message||'Не удалось решить выражение. Проверьте ввод.'};
  }

  lastResult=r;
  lastInput=val;
  renderResult(r,val);

  if(r.ok){
    History.add({
      input:val,
      answer:r.answer,
      mode:mode,
      timestamp:Date.now()
    });
    // Scroll to result
    setTimeout(()=>{
      const rEl=$('result');
      if(rEl) rEl.scrollIntoView({behavior:'smooth',block:'nearest'});
    },100);
  }
}

function clearInput(){
  input.value='';
  resultEl.innerHTML='';
  input.focus();
}

function renderHistory(){
  const list=History.all();
  if(!list.length){
    historyEl.innerHTML='<div class="empty">История пуста. Решите что-нибудь!</div>'+
      '<button class="btn danger" style="margin-top:10px;" onclick="History.clear();renderHistory();">Очистить историю</button>';
    return;
  }
  let html='';
  list.forEach((e,i)=>{
    const d=new Date(e.timestamp);
    const ds=d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    html+=`<div class="hitem" data-idx="${i}">
      <div class="hexpr">${escapeHtml(e.input)}</div>
      <div class="hans">${escapeHtml(e.answer)}</div>
      <div class="hmeta">
        <span>${ds}</span>
        <span class="del" data-del="${i}">Удалить</span>
      </div>
    </div>`;
  });
  html+='<button class="btn danger" style="margin-top:6px;" id="btnClearHistory">Очистить всю историю</button>';
  historyEl.innerHTML=html;

  historyEl.querySelectorAll('.hitem').forEach(el=>{
    el.addEventListener('click',ev=>{
      if(ev.target.dataset.del!==undefined) return;
      const idx=parseInt(el.dataset.idx,10);
      const entry=list[idx];
      if(!entry) return;
      // Restore into calc mode
      setMode(entry.mode==='equation'?'equation':entry.mode==='problem'?'problem':'calc');
      input.value=entry.input;
      // Re-run solve to get fresh steps
      doSolve();
    });
  });
  historyEl.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click',ev=>{
      ev.stopPropagation();
      const idx=parseInt(el.dataset.del,10);
      History.remove(idx);
      renderHistory();
    });
  });
  const clearBtn=$('btnClearHistory');
  if(clearBtn){
    clearBtn.onclick=()=>{
      History.clear();
      renderHistory();
    };
  }
}

/* =========================================================
   KEYPAD
   ========================================================= */
function buildKeypad(){
  const keys=[
    {t:'C',c:'danger',a:()=>{input.value='';input.focus();}},
    {t:'(',c:'fn',a:()=>insertText('(')},
    {t:')',c:'fn',a:()=>insertText(')')},
    {t:'⌫',c:'fn',a:()=>backspace()},
    {t:'7',a:()=>insertText('7')},
    {t:'8',a:()=>insertText('8')},
    {t:'9',a:()=>insertText('9')},
    {t:'÷',c:'op',a:()=>insertText('/')},
    {t:'4',a:()=>insertText('4')},
    {t:'5',a:()=>insertText('5')},
    {t:'6',a:()=>insertText('6')},
    {t:'×',c:'op',a:()=>insertText('*')},
    {t:'1',a:()=>insertText('1')},
    {t:'2',a:()=>insertText('2')},
    {t:'3',a:()=>insertText('3')},
    {t:'−',c:'op',a:()=>insertText('-')},
    {t:'0',a:()=>insertText('0')},
    {t:'.',a:()=>insertText('.')},
    {t:'±',c:'fn',a:()=>insertText('-')},
    {t:'+',c:'op',a:()=>insertText('+')},
    {t:'x',c:'fn',a:()=>insertText('x')},
    {t:'√',c:'fn',a:()=>insertText('sqrt(')},
    {t:'^',c:'fn',a:()=>insertText('^')},
    {t:'%',c:'fn',a:()=>insertText('%')},
    {t:'π',c:'fn',a:()=>insertText('pi')},
    {t:'²',c:'fn',a:()=>insertText('^2')},
    {t:'=',c:'eq',a:()=>insertText('=')},
    {t:'Решить',c:'eq',a:()=>doSolve()}
  ];
  keypad.innerHTML='';
  keys.forEach(k=>{
    const b=document.createElement('button');
    b.className='k '+(k.c||'');
    b.textContent=k.t;
    b.onclick=k.a;
    keypad.appendChild(b);
  });
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  buildKeypad();
  setMode('calc');

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>setMode(t.dataset.mode));
  });

  $('btnSolve').addEventListener('click',doSolve);
  $('btnClear').addEventListener('click',clearInput);

  input.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      doSolve();
    }
  });

  document.addEventListener('keydown',e=>{
    if(mode==='history') return;
    if(document.activeElement!==input) return;
    // Backspace works natively
    // Numbers and operators work natively
    // Enter handled above
  });

  input.focus();
}

init();
</script>
